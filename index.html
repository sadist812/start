<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SADIST</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030303;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-main: #ffffff;
      --text-muted: #888888;
      --accent-red: #ff1a1a;
      --accent-glow: rgba(255, 26, 26, 0.5);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
      overflow-y: auto;
      background-image: 
        linear-gradient(rgba(255, 26, 26, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 26, 26, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: center center;
      cursor: crosshair;
    }

    #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    #cursor-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 700px;
    }

    .header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.8s ease-out; }
    #greeting { color: var(--text-muted); font-size: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: 8px; margin-bottom: 8px; display: block; }
    .header h1 { font-size: 56px; font-weight: 800; margin: 0; letter-spacing: -2px; background: linear-gradient(180deg, #ffffff 0%, #ff1a1a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; line-height: 1; }
    
    .info-container { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 15px; }
    #time { font-size: 44px; font-weight: 700; letter-spacing: 2px; color: var(--accent-red); text-shadow: 0 0 20px var(--accent-glow); line-height: 1; }
    #weather { font-size: 18px; font-weight: 500; color: #cccccc; display: flex; align-items: center; gap: 6px; }
    #weather svg { width: 20px; height: 20px; stroke: #cccccc; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #date { font-size: 14px; color: var(--text-muted); letter-spacing: 2px; margin-top: 8px; text-transform: capitalize; font-weight: 500; }

    .search-box { width: 100%; max-width: 550px; margin-bottom: 40px; animation: fadeInUp 0.8s ease-out; }
    .search-box form { display: flex; align-items: center; width: 100%; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 6px 20px; box-sizing: border-box; backdrop-filter: blur(20px); transition: all 0.3s ease; }
    .search-box form:focus-within { border-color: var(--accent-red); box-shadow: 0 0 25px rgba(255, 26, 26, 0.2); background: rgba(255, 255, 255, 0.04); }
    .search-box input { flex-grow: 1; background: transparent; border: none; color: #fff; font-size: 16px; font-family: inherit; padding: 12px 0; outline: none; }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box button { background: transparent; border: none; color: var(--accent-red); cursor: pointer; padding: 0; margin-left: 10px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, filter 0.2s; }
    .search-box button svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .search-box button:hover { transform: scale(1.1); filter: drop-shadow(0 0 5px var(--accent-red)); }

    .links-wrapper { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; animation: fadeInUp 0.8s ease-out; margin-bottom: 40px; }
    a.link-card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(10px); color: var(--text-main); text-decoration: none; padding: 30px 20px; border-radius: 24px; font-size: 15px; font-weight: 600; transition: all 0.3s ease; text-align: center; width: 160px; box-sizing: border-box; overflow: hidden; }
    a.link-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 26, 26, 0.15), transparent 40%); opacity: 0; transition: opacity 0.3s ease; z-index: 0; pointer-events: none; }
    a.link-card:hover::before { opacity: 1; }
    a.link-card svg { position: relative; z-index: 1; width: 36px; height: 36px; margin-bottom: 15px; fill: var(--text-main); transition: all 0.3s ease; }
    a.link-card span { position: relative; z-index: 1; }
    a.link-card:hover { border-color: rgba(255, 26, 26, 0.4); transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(255, 26, 26, 0.15); color: var(--accent-red); }
    a.link-card:hover svg { fill: var(--accent-red); transform: scale(1.1); filter: drop-shadow(0 0 12px rgba(255, 26, 26, 0.6)); }

    .notes-section { width: 100%; animation: fadeInUp 0.8s ease-out; margin-bottom: 20px; }
    .notes-section label { display: block; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; margin-left: 10px; font-weight: 700; }
    textarea { width: 100%; height: 130px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; color: var(--text-main); font-family: inherit; font-size: 15px; line-height: 1.6; resize: vertical; outline: none; box-sizing: border-box; backdrop-filter: blur(10px); transition: border-color 0.3s ease, box-shadow 0.3s ease; }
    textarea:focus { border-color: var(--accent-red); box-shadow: 0 0 20px rgba(255, 26, 26, 0.15); }
    textarea::placeholder { color: rgba(255, 255, 255, 0.15); }
    textarea::-webkit-scrollbar { width: 6px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: rgba(255, 26, 26, 0.5); border-radius: 10px; }
    textarea::-webkit-scrollbar-thumb:hover { background: var(--accent-red); }

    .noise-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s ease; z-index: 100; }
    .noise-btn:hover { border-color: var(--accent-red); color: var(--accent-red); transform: scale(1.1); }
    .noise-btn.active { color: var(--accent-red); border-color: var(--accent-red); box-shadow: 0 0 20px var(--accent-glow); text-shadow: 0 0 10px var(--accent-red); }

    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      .header h1 { font-size: 42px; }
      #greeting { font-size: 13px; letter-spacing: 5px; }
      #time { font-size: 36px; }
      .info-container { flex-direction: column; gap: 5px; }
      .links-wrapper { gap: 15px; }
      a.link-card { width: calc(50% - 15px); padding: 20px 10px; }
      a.link-card svg { width: 30px; height: 30px; }
      .search-box { max-width: 100%; }
      a.link-card::before { display: none; } 
      .noise-btn { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 20px; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <canvas id="cursor-canvas"></canvas>

  <div class="content">
    <div class="header">
      <span id="greeting">Загрузка...</span>
      <h1>SADIST</h1>
      
      <div class="info-container">
        <div id="time">00:00</div>
        <div id="weather">...</div>
      </div>
      <div id="date">Загрузка...</div>
    </div>

    <div class="search-box">
      <form action="https://duckduckgo.com/" method="GET" target="_blank">
        <input type="text" name="q" placeholder="Поиск..." required autocomplete="off">
        <button type="submit" title="Искать">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </div>

    <div class="links-wrapper">
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="link-card">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span>YouTube</span>
      </a>
      
      <a href="https://music.yandex.ru" target="_blank" rel="noopener noreferrer" class="link-card">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7c0 1.1.9 2 2 2h4v-8H5v-1c0-3.87 3.13-7 7-7s7 3.13 7 7v1h-4v8h4c1.1 0 2-.9 2-2v-7a9 9 0 0 0-9-9z"/></svg>
        <span>Музыка</span>
      </a>
      
      <a href="https://vk.com" target="_blank" rel="noopener noreferrer" class="link-card">
        <svg viewBox="0 0 24 24"><path d="M21.579 6.855c.14-.465 0-.806-.662-.806h-2.194c-.554 0-.81.294-.949.618 0 0-1.108 2.699-2.678 4.45-.508.508-.738.67-1.016.67-.138 0-.337-.162-.337-.627V6.855c0-.557-.16-.806-.62-.806h-3.45c-.346 0-.554.257-.554.501 0 .524.785.644.866 2.112v3.187c0 .694-.126.82-.404.82-.738 0-2.533-2.708-3.597-5.81-.208-.604-.417-.85-.974-.85H2.872c-.623 0-.747.294-.747.618 0 .577.738 3.42 3.42 7.184 1.79 2.598 4.304 4.004 6.59 4.004 1.374 0 1.543-.31 1.543-.842v-1.94c0-.612.128-.734.56-.734.316 0 .86.16 2.128 1.382 1.448 1.448 1.686 2.134 2.501 2.134h2.194c.623 0 .935-.31.748-.92-.204-.609-1.328-1.916-2.451-3.17-.338-.4-.845-.827-1-.96-.209-.27-.15-.389 0-.632 0 0 1.772-2.497 2.46-5.166z"/></svg>
        <span>ВКонтакте</span>
      </a>

      <!-- Кнопка Telegram с открытием приложения -->
      <a href="tg://resolve" target="_blank" rel="noopener noreferrer" class="link-card">
        <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        <span>Telegram</span>
      </a>

      <a href="https://chat.deepseek.com/" target="_blank" rel="noopener noreferrer" class="link-card">
        <svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill-rule="evenodd" clip-rule="evenodd"/></svg>
        <span>DeepSeek</span>
      </a>

      <a href="https://lk.100points.ru/student/dashboard" target="_blank" rel="noopener noreferrer" class="link-card">
        <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7v7l9-11h-7V3z"/></svg>
        <span>100points</span>
      </a>
    </div>

    <div class="notes-section">
      <label>Быстрые заметки</label>
      <textarea id="notes" placeholder="Пиши здесь свои мысли..."></textarea>
    </div>
  </div>

  <button id="noise-btn" class="noise-btn" title="Включить звук для продуктивности">☁️</button>

  <script>
    // --- 1. ЧАСЫ И ПРИВЕТСТВИЕ ---
    function updateClockAndGreeting() {
      const now = new Date();
      const optionsTime = { timeZone: 'Asia/Yekaterinburg', hour: '2-digit', minute: '2-digit' };
      const optionsDate = { timeZone: 'Asia/Yekaterinburg', weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('time').textContent = now.toLocaleTimeString('ru-RU', optionsTime);
      document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', optionsDate);
      const hour = parseInt(new Date().toLocaleString('en-US', { timeZone: 'Asia/Yekaterinburg', hour: 'numeric', hour12: false }));
      let greetingText = hour >= 5 && hour < 12 ? "Доброе утро" : hour >= 12 && hour < 18 ? "Добрый день" : hour >= 18 && hour < 23 ? "Добрый вечер" : "Доброй ночи";
      document.getElementById('greeting').innerText = greetingText;
    }
    setInterval(updateClockAndGreeting, 1000);
    updateClockAndGreeting();

    // --- 2. ПОГОДА ---
    fetch('https://api.open-meteo.com/v1/forecast?latitude=55.1644&longitude=61.4368&current_weather=true')
      .then(res => res.json())
      .then(data => {
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;
        let iconSVG = '';
        if (code === 0) {
          iconSVG = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        } else if (code >= 1 && code <= 3) {
          iconSVG = `<svg viewBox="0 0 24 24"><path d="M17 18a5 5 0 0 0-10 0"></path><line x1="12" y1="9" x2="12" y2="2"></line><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line><line x1="1" y1="18" x2="3" y2="18"></line><line x1="21" y1="18" x2="23" y2="18"></line><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line><line x1="23" y1="22" x2="1" y2="22"></line><polyline points="8 6 12 2 16 6"></polyline></svg>`;
        } else if (code >= 71 && code <= 77 || code >= 85 && code <= 86) {
          iconSVG = `<svg viewBox="0 0 24 24"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"></path><line x1="8" y1="16" x2="8" y2="22"></line><line x1="16" y1="16" x2="16" y2="22"></line><line x1="12" y1="18" x2="12" y2="24"></line></svg>`;
        } else {
          iconSVG = `<svg viewBox="0 0 24 24"><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path><line x1="8" y1="19" x2="8" y2="21"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="16" y1="19" x2="16" y2="21"></line></svg>`;
        }
        document.getElementById('weather').innerHTML = `${iconSVG} <span>${temp}°C</span>`;
      }).catch(() => { document.getElementById('weather').innerText = '--°C'; });

    // --- 3. БЛОКНОТ ---
    const notesArea = document.getElementById('notes');
    notesArea.value = localStorage.getItem('sadist_notes') || '';
    notesArea.addEventListener('input', () => { localStorage.setItem('sadist_notes', notesArea.value); });

    // --- 4. ПРОЖЕКТОР НА КНОПКАХ ---
    document.querySelectorAll('.link-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
        card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
      });
    });

    // --- 5. ФОНОВЫЙ ШУМ (Розовый шум) ---
    const noiseBtn = document.getElementById('noise-btn');
    let audioCtx = null;
    let noiseSource = null;
    let isNoisePlaying = false;

    noiseBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      if (isNoisePlaying) {
        noiseSource.stop();
        noiseBtn.classList.remove('active');
        noiseBtn.innerText = '☁️';
        isNoisePlaying = false;
      } else {
        const bufferSize = audioCtx.sampleRate * 4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        let b0, b1, b2, b3, b4, b5, b6;
        b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
        
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          data[i] *= 0.11;
          b6 = white * 0.115926;
        }
        
        noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 800;

        noiseSource.connect(filter);
        filter.connect(audioCtx.destination);
        noiseSource.start();
        
        noiseBtn.classList.add('active');
        noiseBtn.innerText = '🎧';
        isNoisePlaying = true;
      }
    });

    // --- 6. ДЕЛИКАТНЫЙ ШЛЕЙФ ЗА КУРСОРОМ ---
    const cursorCanvas = document.getElementById('cursor-canvas');
    const cursorCtx = cursorCanvas.getContext('2d');
    let cWidth, cHeight;
    let trail = [];
    let lastMouseMove = 0;

    function resizeCursor() {
      cWidth = cursorCanvas.width = window.innerWidth;
      cHeight = cursorCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCursor);
    resizeCursor();

    window.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastMouseMove > 40) {
        trail.push({ x: e.clientX, y: e.clientY, alpha: 0.6, size: Math.random() * 2.5 + 1 });
        lastMouseMove = now;
      }
    });

    function animateCursor() {
      cursorCtx.clearRect(0, 0, cWidth, cHeight);
      for (let i = 0; i < trail.length; i++) {
        let p = trail[i];
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          trail.splice(i, 1);
          i--;
          continue;
        }
        cursorCtx.fillStyle = `rgba(255, 26, 26, ${p.alpha})`;
        cursorCtx.beginPath();
        cursorCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        cursorCtx.fill();
      }
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // --- 7. ЖИВОЙ ФОН (Искры) ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * -0.5 - 0.1;
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < 0) this.y = height;
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
      }
      draw() {
        ctx.fillStyle = `rgba(255, 26, 26, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 60; i++) { particles.push(new Particle()); }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
