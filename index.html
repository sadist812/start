<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SADIST</title>
  <!-- Иконка капли крови -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩸</text></svg>">
  
  <style>
    :root {
      --bg-color: #050505;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #888888;
      --accent-red: #ff3333;
      --accent-glow: rgba(255, 51, 51, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden; /* Чтобы фон не создавал скролл */
    }

    /* Холст для частиц */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Контейнер для контента, чтобы он был поверх фона */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
    }

    /* Шапка с часами */
    .header {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 0.8s ease-out;
    }

    .header h1 {
      font-size: 42px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #ffffff, #ff3333);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* Часы и дата */
    .clock-container {
      margin-top: 10px;
      color: var(--accent-red);
    }
    
    #time {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    #date {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-top: 5px;
      text-transform: capitalize;
    }

    /* Строка поиска */
    .search-box {
      width: 100%;
      max-width: 500px;
      margin-bottom: 40px;
      animation: fadeInUp 0.8s ease-out;
    }

    .search-box form {
      display: flex;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 5px 20px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-box form:focus-within {
      border-color: var(--accent-red);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .search-box input {
      flex-grow: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      padding: 12px 0;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box button {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 20px;
      cursor: pointer;
      padding: 0 10px;
      transition: transform 0.2s;
    }

    .search-box button:hover {
      transform: scale(1.1);
    }

    /* Сетка для кнопок */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      width: 100%;
      animation: fadeInUp 0.8s ease-out;
    }

    a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-main);
      text-decoration: none;
      padding: 30px 20px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }

    a .icon {
      font-size: 36px;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    a:hover {
      background: rgba(255, 51, 51, 0.05);
      border-color: var(--accent-red);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px -10px var(--accent-glow);
    }

    a:hover .icon {
      transform: scale(1.15);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 32px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
      a { padding: 20px 10px; font-size: 14px; }
      a .icon { font-size: 30px; }
      .search-box { max-width: 90%; }
    }
  </style>
</head>
<body>

  <!-- Фон с частицами -->
  <canvas id="bg-canvas"></canvas>

  <div class="content">
    <div class="header">
      <h1>SADIST</h1>
      <div class="clock-container">
        <div id="time">00:00:00</div>
        <div id="date">Загрузка...</div>
      </div>
    </div>

    <!-- Приватный поиск (DuckDuckGo) -->
    <div class="search-box">
      <form action="https://duckduckgo.com/" method="GET" target="_blank">
        <input type="text" name="q" placeholder="Безопасный поиск (DuckDuckGo)..." required autocomplete="off">
        <button type="submit">🔍</button>
      </form>
    </div>

    <div class="grid">
      <!-- Добавлен rel="noopener noreferrer" для безопасности! -->
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer">
        <span class="icon">▶️</span>
        YouTube
      </a>
      
      <a href="https://music.yandex.ru" target="_blank" rel="noopener noreferrer">
        <span class="icon">🎵</span>
        Музыка
      </a>
      
      <a href="https://vk.com" target="_blank" rel="noopener noreferrer">
        <span class="icon">💬</span>
        ВКонтакте
      </a>

      <a href="https://t.me" target="_blank" rel="noopener noreferrer">
        <span class="icon">✈️</span>
        Telegram
      </a>
    </div>
  </div>

  <script>
    // --- 1. ЧАСЫ И ДАТА (Челябинск, UTC+5) ---
    function updateClock() {
      const now = new Date();
      const optionsTime = { timeZone: 'Asia/Yekaterinburg', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      const optionsDate = { timeZone: 'Asia/Yekaterinburg', weekday: 'long', day: 'numeric', month: 'long' };
      
      document.getElementById('time').textContent = now.toLocaleTimeString('ru-RU', optionsTime);
      document.getElementById('date').textContent = now.toLocaleDateString('ru-RU', optionsDate);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. ЖИВОЙ ФОН (Алые искры) ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5; // Размер искры
        this.speedX = Math.random() * 0.5 - 0.25; // Медленное движение по X
        this.speedY = Math.random() * -0.5 - 0.1; // Медленный подъем вверх
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        // Если искра улетела вверх или вбок, возвращаем её вниз
        if (this.y < 0) this.y = height;
        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
      }
      draw() {
        ctx.fillStyle = `rgba(255, 51, 51, ${this.opacity})`; // Алый цвет
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Создаем 50 искр (не нагружает систему)
    for (let i = 0; i < 50; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
