<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARENA — киберспортивный клуб, Челябинск</title>
  <meta name="description" content="Киберспортивный клуб ARENA в Челябинске: игровые ПК RTX 4070 Ti, 240 Гц, PS5 Lounge, ночные тарифы. Круглосуточно, ул. Кирова, 15.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0b0e; 
      --bg-card: #121419;
      --bg-card-hover: #181b22;
      --text-main: #ffffff;
      --text-muted: #8b92a0;
      --accent: #10b981; 
      --accent-glow: rgba(16, 185, 129, 0.4);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
      background-repeat: no-repeat;
    }

    #matrix-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.05; 
    }

    /* ПАРЯЩАЯ ПЛАШКА НАВИГАЦИИ */
    .nav-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: max-content;
      max-width: 95%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: rgba(18, 20, 25, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      gap: 40px;
    }

    .logo {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }

    nav { display: flex; gap: 30px; }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.3s;
      position: relative;
    }
    nav a:hover, nav a.active { color: var(--text-main); }
    nav a::after {
      content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
      width: 0%; height: 2px; background: var(--accent);
      transition: width 0.3s ease; border-radius: 2px;
    }
    nav a.active::after { width: 100%; }

    /* ГЛАВНЫЙ ЭКРАН */
    .hero {
      text-align: center;
      padding: 200px 20px 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 80vh;
      justify-content: center;
    }

    .hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(45px, 8vw, 85px);
      font-weight: 900;
      margin: 0;
      line-height: 1.05;
      letter-spacing: -2px;
      color: #fff;
      animation: slideUp 0.8s ease-out forwards;
      opacity: 0;
    }

    .hero h1 span {
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
    }

    .hero p {
      font-size: 20px;
      color: var(--text-muted);
      max-width: 650px;
      margin: 25px 0 45px;
      line-height: 1.6;
      animation: slideUp 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #fff;
      padding: 18px 45px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 20px var(--accent-glow);
      animation: slideUp 0.8s ease-out 0.4s forwards;
      opacity: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-main:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 0 40px var(--accent-glow), 0 10px 20px rgba(0,0,0,0.5);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Секции */
    section { padding: 80px 5%; max-width: 1200px; margin: 0 auto; }
    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 50px;
      text-align: center;
    }

    /* ГАЛЕРЕЯ (Надежные ссылки + фоллбэк) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }
    .gallery-item {
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(45deg, #121419, #1a2a22); /* Подложка, если фото не загрузится */
      border: 1px solid var(--border-color);
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .gallery-item::before {
      content: '🎮'; /* Иконка на случай если нет картинки */
      position: absolute;
      font-size: 50px;
      opacity: 0.2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease, opacity 0.6s;
      opacity: 0.85;
      position: relative;
      z-index: 1; /* Чтобы картинка перекрывала иконку */
    }
    .gallery-item:hover img {
      transform: scale(1.08);
      opacity: 1;
    }

    /* ТАРИФЫ */
    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 45px 30px;
      text-align: center;
      transition: all 0.3s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }
    .card.vip {
      border-color: var(--accent);
      background: linear-gradient(180deg, var(--bg-card) 0%, rgba(16, 185, 129, 0.05) 100%);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.1);
    }
    .card h3 { font-size: 22px; margin-top: 0; }
    .price { font-size: 48px; font-weight: 900; margin: 20px 0; color: #fff;}
    .price span { font-size: 16px; color: var(--text-muted); font-weight: 400; }
    .card ul { list-style: none; padding: 0; margin: 0 0 35px 0; color: var(--text-muted); line-height: 2.2; font-size: 16px; }
    .btn-card {
      width: 100%; padding: 16px 0; background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-main);
      border-radius: 12px; font-weight: 600; font-size: 16px;
      transition: all 0.3s; cursor: pointer;
    }
    .btn-card:hover {
      background: var(--accent); border-color: var(--accent); color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* КОНТАКТЫ */
    .contacts-wrapper {
      display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 20px; overflow: hidden;
    }
    .contact-info { padding: 50px; }
    .contact-info h3 { font-family: 'Montserrat', sans-serif; font-size: 28px; margin-top: 0; }
    .contact-info p { color: var(--text-muted); font-size: 16px; margin-bottom: 20px; line-height: 1.6; }
    .contact-info strong { color: #fff; }
    .map-container iframe { width: 100%; height: 100%; min-height: 350px; border: 0; filter: grayscale(100%) invert(90%) contrast(80%); }

    /* МОДАЛЬНОЕ ОКНО */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 2000;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 40px; width: 90%; max-width: 450px;
      position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      transform: translateY(30px); transition: transform 0.3s;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 20px; right: 20px; color: var(--text-muted); font-size: 28px; cursor: pointer; background: none; border: none; }
    .close-modal:hover { color: #fff; }
    .modal-content h3 { text-align: center; font-family: 'Montserrat', sans-serif; font-size: 24px; margin-top: 0; }
    .modal-content p { text-align: center; color: var(--text-muted); font-size: 15px; margin-bottom: 25px; }
    .modal-content input, .modal-content select {
      width: 100%; padding: 16px; background: var(--bg-main); border: 1px solid var(--border-color);
      border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none;
    }
    .modal-content input:focus, .modal-content select:focus { border-color: var(--accent); }
    ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .btn-submit {
      width: 100%; padding: 16px; background: var(--accent); color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.3s; margin-top: 10px;
    }
    .btn-submit:hover { background: #059669; box-shadow: 0 0 20px var(--accent-glow); }

    footer { text-align: center; padding: 40px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 15px; margin-top: 50px; }

    @media (max-width: 768px) {
      header { flex-direction: column; padding: 20px; gap: 20px; border-radius: 20px; }
      nav { flex-wrap: wrap; justify-content: center; gap: 15px; }
      .hero { padding-top: 250px; }
      .contacts-wrapper { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <!-- КОНСТАНТА КОНТАКТА: замени в 2 местах — здесь и в <footer>. Дизайн не трогал. -->
  <div style="display:none" id="club-contact">
    <span id="club-phone">+7 (999) 123-45-67</span>
    <span id="club-address">г. Челябинск, ул. Кирова, д. 15</span>
  </div>

  <!-- ПАРЯЩАЯ НАВИГАЦИЯ -->
  <div class="nav-container">
    <header>
      <div class="logo">ARENA<span>.</span></div>
      <nav>
        <a href="#hero" class="active">Главная</a>
        <a href="#gallery">Клуб</a>
        <a href="#pricing">Тарифы</a>
        <a href="#contacts">Контакты</a>
      </nav>
    </header>
  </div>

  <section class="hero" id="hero">
    <h1>ИГРА НАЧИНАЕТСЯ<br><span>ЗДЕСЬ</span></h1>
    <p>Мощные ПК, топовые консоли и атмосфера настоящего киберспорта. Заходи, занимай место, забирай победу.</p>
    <button class="btn-main" onclick="openModal()">Забронировать место 🎮</button>
  </section>

  <!-- ГАЛЕРЕЯ (Pexels + защита от не загрузки) -->
  <section id="gallery" class="fade-in">
    <h2 class="section-title">Атмосфера клуба</h2>
    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="https://images.pexels.com/photos/7915357/pexels-photo-7915357.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Игровая зона" loading="lazy" decoding="async">
      </div>
      <div class="gallery-item">
        <img src="https://images.pexels.com/photos/3945653/pexels-photo-3945653.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Геймеры" loading="lazy" decoding="async">
      </div>
      <div class="gallery-item">
        <img src="https://images.pexels.com/photos/2007647/pexels-photo-2007647.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Киберспорт" loading="lazy" decoding="async">
      </div>
      <div class="gallery-item">
        <img src="https://images.pexels.com/photos/2582937/pexels-photo-2582937.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Консоли" loading="lazy" decoding="async">
      </div>
      <div class="gallery-item">
        <img src="https://images.pexels.com/photos/442576/pexels-photo-442576.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Сетап" loading="lazy" decoding="async">
      </div>
      <div class="gallery-item">
