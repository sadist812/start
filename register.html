<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARENA | Авторизация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0b0e; 
      --bg-card: #121419;
      --text-main: #ffffff;
      --text-muted: #8b92a0;
      --accent: #10b981; 
      --accent-glow: rgba(16, 185, 129, 0.4);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* МАТРИЧНЫЙ ФОН */
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.05; 
    }

    /* КАРТОЧКА АВТОРИЗАЦИИ */
    .auth-card {
      background: rgba(18, 20, 25, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 50px 40px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(16, 185, 129, 0.05);
      position: relative;
      z-index: 1;
    }

    /* Кнопка "Назад" */
    .back-link {
      position: absolute;
      top: 25px;
      left: 25px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 20px;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--text-main); }

    .logo {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    .logo span { color: var(--accent); }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 35px;
    }

    /* ФОРМА */
    form { display: flex; flex-direction: column; gap: 15px; }

    .input-group { position: relative; }

    input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(10, 11, 14, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder { color: var(--text-muted); }

    input:focus {
      border-color: var(--accent);
      background: rgba(10, 11, 14, 0.8);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
    }

    /* Кнопка входа */
    .btn-auth {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    /* Переключатель */
    .toggle-auth {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .toggle-auth a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .toggle-auth a:hover { text-decoration: underline; }

    /* Скрываем форму регистрации по умолчанию */
    .register-form { display: none; }

  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <div class="auth-card">
    <a href="arena.html" class="back-link" title="На главную">←</a>
    
    <div class="logo">ARENA<span>.</span></div>
    
    <!-- Форма Входа -->
    <div id="login-section">
      <div class="subtitle">Вход в систему клуба</div>
      <form onsubmit="event.preventDefault(); window.location.href='profile.html';">
        <div class="input-group">
          <input type="text" placeholder="Твой никнейм" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Пароль" required>
        </div>
        <button type="submit" class="btn-auth">Войти в профиль</button>
      </form>
      <div class="toggle-auth">
        Нет аккаунта? <a onclick="toggleAuth()">Зарегистрироваться</a>
      </div>
    </div>

    <!-- Форма Регистрации -->
    <div id="register-section" class="register-form">
      <div class="subtitle">Создание нового профиля</div>
      <form onsubmit="event.preventDefault(); window.location.href='profile.html';">
        <div class="input-group">
          <input type="text" placeholder="Придумай никнейм" required>
        </div>
        <div class="input-group">
          <input type="email" placeholder="Email" required>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Пароль" required>
        </div>
        <button type="submit" class="btn-auth">Создать аккаунт</button>
      </form>
      <div class="toggle-auth">
        Уже есть аккаунт? <a onclick="toggleAuth()">Войти</a>
      </div>
    </div>

  </div>

  <script>
    // --- 1. ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ВХОДОМ И РЕГИСТРАЦИЕЙ ---
    function toggleAuth() {
      const loginSec = document.getElementById('login-section');
      const regSec = document.getElementById('register-section');
      
      if (loginSec.style.display === 'none') {
        loginSec.style.display = 'block';
        regSec.style.display = 'none';
      } else {
        loginSec.style.display = 'none';
        regSec.style.display = 'block';
      }
    }

    // --- 2. МАТРИЧНЫЙ ФОН (Для антуража) ---
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;

    function drawMatrix() {
      ctx.fillStyle = 'rgba(10, 11, 14, 0.1)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#10b981'; 
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 60);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
